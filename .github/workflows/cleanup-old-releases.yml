name: Cleanup Old Releases

on:
  release:
    types: [published]
  workflow_dispatch: # Manuell auslösbar

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Keep only 3 latest releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log(`📦 Hole alle Releases für ${owner}/${repo}...`);
            
            // Hole alle Releases
            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });
            
            console.log(`✅ ${releases.length} Releases gefunden`);
            
            // Sortiere nach Erstellungsdatum (neueste zuerst)
            const sortedReleases = releases.sort((a, b) => 
              new Date(b.created_at) - new Date(a.created_at)
            );
            
            // Behalte nur die 3 neuesten
            const keepCount = 3;
            const releasesToDelete = sortedReleases.slice(keepCount);
            
            console.log(`🔒 Behalte die ${keepCount} neuesten Releases:`);
            sortedReleases.slice(0, keepCount).forEach((release, index) => {
              console.log(`  ${index + 1}. ${release.tag_name} (${release.name})`);
            });
            
            if (releasesToDelete.length === 0) {
              console.log('✅ Keine alten Releases zum Löschen');
              return;
            }
            
            console.log(`\n🗑️ Lösche ${releasesToDelete.length} alte Releases:`);
            
            for (const release of releasesToDelete) {
              try {
                console.log(`  ❌ Lösche: ${release.tag_name} (${release.name})`);
                
                // Lösche Release
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });
                
                // Lösche auch den Git-Tag
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                  console.log(`    ✅ Tag ${release.tag_name} gelöscht`);
                } catch (tagError) {
                  console.log(`    ⚠️ Tag konnte nicht gelöscht werden: ${tagError.message}`);
                }
                
              } catch (error) {
                console.error(`    ❌ Fehler beim Löschen: ${error.message}`);
              }
            }
            
            console.log('\n✅ Cleanup abgeschlossen!');
            console.log(`📊 Verbleibende Releases: ${keepCount}`);
